<!DOCTYPE html>
<html>
<head>
  <title>Simple Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
    }

    input {
      margin: 10px;
      padding: 10px;
      width: 80%;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin: 8px;
      padding: 10px 15px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      transition: 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    #result {
      
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Simple Calculator</h2>

    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">

    <button onclick="calculate('+')">addition</button>
    <button onclick="calculate('-')">subtraction</button>
    <button onclick="calculate('*')">multiplication</button>
    <button onclick="calculate('/')">division</button>
    <h3 id="result"></h3>
    <script>
      function calculate(operator) {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);
        let result;
        switch (operator) {
          case "+":
            result = a + b;
            break;
          case "-":
            result = a - b;
            break;
          case "*":
            result = a * b;
            break;
          case "/":
            if (b == 0) result = "division by zero not possible";
            else result = a / b;
            break;
        }
        document.getElementById("result").innerHTML = "result = " + result;
      }
    </script>
</body>
</html>
