

<!doctype html>
<html>
  <head>
    <style>
      body {
        font-family: arial;
        text-align: center;
        margin-top: 100px;
      }
      #toast {
        


        visibility: hidden;
        min-width: 250px;
        background: #333;
        color: white;
        padding: 15px;
        border-radius: 5px;
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
      }
      #toast.show {
        visibility: visible;

        
      }
    </style>
  </head>
  <body>
    <h2>toast notification</h2>
    <button onclick="showtoast()">show notification</button>
    <div id="toast">successfully submitted!</div>
    <script>
      function showtoast() {
        let toast = document.getElementById("toast");
        toast.className = "show";
        setTimeout(function () {
          toast.className = "";
        }, 3000);
      }
    </script>
  </body>
</html>
