
<!DOCTYPE html>
<html>

<head>
    <title>Toast Notification</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }

       
        .row {
            margin: 15px;
        }


        input {
            padding: 10px;
            width: 250px;
            
        }

        button {
            padding: 10px 25px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            
        }

        button:hover {
            background-color: darkgreen;
        }

    #toast {
    visibility: hidden;
    background-color: black;
    color: white;
    padding: 15px;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 5px;
}
        #toast.show {
            visibility: visible;
        }
    </style>
</head>

<body>

    <h2>Student Information</h2>

    <div>

        <div class="row">
            <label>Student Name:</label>
            <input type="text" id="name">
        </div>

        <div class="row">
            <label>Student USN:</label>
            <input type="text" id="usn">
        </div>

        <div class="row">
            <label>Course:</label>
            <input type="text" id="course">
        </div>

        <center>
            <button onclick="saveStudent()">Save</button>
        </center>

    </div>

    <div id="toast">
        Student Registered Successfully!
    </div>

    <script>

        function saveStudent() {

            var name = document.getElementById("name").value;
            var usn = document.getElementById("usn").value;

            if (name != "" && usn != "") {

                var toast = document.getElementById("toast");

                toast.className = "show";

                setTimeout(function() {
                    toast.className = "";
                }, 3000);
            }
        }

    </script>

</body>

</html>
